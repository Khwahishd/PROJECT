name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: install
        run: pip install -e ".[api,dev]"

      - name: ruff
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      # The whole suite runs with no API key and no network: the default
      # providers are deterministic and local. That is a design property, so
      # it is worth stating in CI rather than assuming.
      - name: pytest
        run: pytest -q

      - name: cli smoke test
        run: |
          python -m lens.cli search "reciprocal rank fusion" -k 3
          python -m lens.cli ask "what is BM25" -k 3
          python -m lens.cli eval --retriever hybrid
          python -m lens.cli sweep

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
