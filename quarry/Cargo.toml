[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A vectorized analytical SQL query engine: hand-written parser, cost-aware optimizer, and columnar execution"
license = "MIT"
repository = "https://github.com/Khwahishd/quarry"
readme = "README.md"
keywords = ["sql", "database", "query-engine", "columnar", "vectorized"]
categories = ["database-implementations"]

[dependencies]
# Intentionally none. The parser, the columnar arrays, the optimizer and the
# execution engine are all written from scratch -- that is the point of the
# project. Dev-dependencies are used only for benchmarking.

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "query"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
